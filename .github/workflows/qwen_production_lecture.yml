name: Qwen Production Lecture
'on':
  workflow_call:
    inputs:
      task_slot:
        type: number
        required: true
      automatic_terms:
        type: boolean
        default: false
      shard_mode:
        type: string
        default: '2'
      publish_results:
        type: boolean
        default: false
    secrets:
      DB_ENCRYPTION_KEY:
        required: true
      STUID:
        required: true
      UISPSW:
        required: true
      UIS_OTP_SECRET:
        required: false
      COURSE_IDS:
        required: true
      DOUBAO_ASR_API_KEY:
        required: false
      TAVILY_API_KEY:
        required: false
      DASHSCOPE_API_KEY:
        required: false
      SMTP_PASSWORD:
        required: false
      DEEPSEEK_API_KEY:
        required: false
      GEMINI_API_KEY:
        required: false
      DASHSCOPE_BASE_URL:
        required: false
      DEEPSEEK_BASE_URL:
        required: false
      GEMINI_BASE_URL:
        required: false
permissions:
  contents: write
  actions: read
env:
  DB_ENCRYPTION_KEY: ${{ secrets.DB_ENCRYPTION_KEY }}
  GH_TOKEN: ${{ github.token }}
  QWEN_PRODUCTION_TASK: 'true'
  HF_HUB_DISABLE_TELEMETRY: '1'
  TOKENIZERS_PARALLELISM: 'false'
  OMP_NUM_THREADS: '4'
  MKL_NUM_THREADS: '4'
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      actions: read
    outputs:
      workers: ${{ steps.prepare.outputs.workers }}
    env:
      COURSE_SLOT: ${{ inputs.task_slot }}
      SHARD_MODE: ${{ inputs.shard_mode }}
      AUTO_COURSE_TERMS: ${{ inputs.automatic_terms }}
      USE_OFFICIAL_TRANSCRIPT: '1'
      PUBLISH_RESULTS: ${{ inputs.publish_results }}
      StuId: ${{ secrets.STUID }}
      UISPsw: ${{ secrets.UISPSW }}
      UIS_OTP_SECRET: ${{ secrets.UIS_OTP_SECRET }}
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: ./.github/actions/qwen-pilot-runtime
    - uses: actions/download-artifact@v4
      with:
        name: qwen-production-queue
        path: ${{ runner.temp }}/qwen-shards/inbox
    - name: prepare
      run: python -m scripts.production_qwen prepare
      id: prepare
    - uses: actions/upload-artifact@v4
      if: ${{ always() }}
      with:
        name: qwen-production-prepare-${{ inputs.task_slot }}
        path: |-
          ${{ runner.temp }}/qwen-shards/out/prepared.enc
          ${{ runner.temp }}/qwen-shards/out/prepared-*-part-*.enc
        retention-days: 7
        compression-level: 0
        overwrite: true
        if-no-files-found: ignore
    - uses: actions/upload-artifact@v4
      if: ${{ always() }}
      with:
        name: qwen-production-prepare-audit-${{ inputs.task_slot }}
        path: ${{ runner.temp }}/qwen-shards/out/prepare-failure.json
        retention-days: 7
        if-no-files-found: ignore
    - name: clean
      run: python -m scripts.production_qwen clean
      if: ${{ always() }}
  asr:
    needs: prepare
    if: ${{ needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
      actions: read
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.prepare.outputs.workers) }}
    env:
      COURSE_SLOT: ${{ inputs.task_slot }}
      SHARD_MODE: ${{ inputs.shard_mode }}
      AUTO_COURSE_TERMS: ${{ inputs.automatic_terms }}
      USE_OFFICIAL_TRANSCRIPT: '1'
      SHARD_ID: ${{ matrix.shard_id }}
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: ./.github/actions/qwen-asr-runtime
      with:
        inference: ${{ env.SHARD_ID != '-1' }}
    - uses: actions/download-artifact@v4
      with:
        name: qwen-production-prepare-${{ inputs.task_slot }}
        path: ${{ runner.temp }}/qwen-shards/inbox
    - name: worker
      run: python -m scripts.production_qwen worker
    - uses: actions/upload-artifact@v4
      if: ${{ always() }}
      with:
        name: qwen-production-asr-${{ inputs.task_slot }}-${{ matrix.shard_id }}
        path: ${{ runner.temp }}/qwen-shards/out/worker-result.enc
        retention-days: 7
        compression-level: 0
        overwrite: true
        if-no-files-found: ignore
    - uses: actions/upload-artifact@v4
      if: ${{ always() }}
      with:
        name: qwen-production-shared-${{ inputs.task_slot }}-${{ matrix.shard_id }}
        path: |
          ${{ runner.temp }}/qwen-shards/out/shared-queue.enc
          ${{ runner.temp }}/qwen-shards/out/shared-local.enc
          ${{ runner.temp }}/qwen-shards/out/worker-audit.json
        retention-days: 7
        compression-level: 0
        overwrite: true
        if-no-files-found: ignore
    - name: clean
      run: python -m scripts.production_qwen clean
      if: ${{ always() }}
  gather:
    name: finalize-${{ inputs.task_slot }}
    needs:
    - prepare
    - asr
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    env:
      COURSE_SLOT: ${{ inputs.task_slot }}
      SHARD_MODE: ${{ inputs.shard_mode }}
      AUTO_COURSE_TERMS: ${{ inputs.automatic_terms }}
      USE_OFFICIAL_TRANSCRIPT: '1'
      StuId: ${{ secrets.STUID }}
      UISPsw: ${{ secrets.UISPSW }}
      UIS_OTP_SECRET: ${{ secrets.UIS_OTP_SECRET }}
      DOUBAO_ASR_API_KEY: ${{ secrets.DOUBAO_ASR_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      DASHSCOPE_BASE_URL: ${{ secrets.DASHSCOPE_BASE_URL }}
      DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
      GEMINI_BASE_URL: ${{ secrets.GEMINI_BASE_URL }}
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: ./.github/actions/qwen-pilot-runtime
      with:
        inference: 'true'
    - uses: actions/download-artifact@v4
      with:
        name: qwen-production-prepare-${{ inputs.task_slot }}
        path: ${{ runner.temp }}/qwen-shards/inbox
    - uses: actions/download-artifact@v4
      continue-on-error: true
      with:
        pattern: qwen-production-asr-${{ inputs.task_slot }}-*
        path: ${{ runner.temp }}/qwen-shards/results
    - name: Finalize through LectureRunner with saved quota
      run: python -m scripts.production_qwen gather
    - uses: actions/upload-artifact@v4
      if: ${{ always() }}
      with:
        name: qwen-production-state-${{ inputs.task_slot }}
        path: ${{ runner.temp }}/qwen-shards/out/state.enc
        retention-days: 7
        compression-level: 0
        overwrite: true
        if-no-files-found: ignore
    - uses: actions/upload-artifact@v4
      if: ${{ always() }}
      with:
        name: qwen-validation-result-${{ inputs.task_slot }}
        path: ${{ runner.temp }}/qwen-shards/out/validation-result.json
        retention-days: 7
        overwrite: true
        if-no-files-found: ignore
    - name: clean
      run: python -m scripts.production_qwen clean
      if: ${{ always() }}
  publish:
    needs: gather
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    env:
      COURSE_SLOT: ${{ inputs.task_slot }}
      SHARD_MODE: ${{ inputs.shard_mode }}
      AUTO_COURSE_TERMS: ${{ inputs.automatic_terms }}
      USE_OFFICIAL_TRANSCRIPT: '1'
      COURSE_IDS: ${{ secrets.COURSE_IDS }}
      PUBLISH_RESULTS: ${{ inputs.publish_results }}
      STUID: ${{ secrets.STUID }}
      UISPSW: ${{ secrets.UISPSW }}
      UIS_OTP_SECRET: ${{ secrets.UIS_OTP_SECRET }}
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: python -m pip install cryptography pycryptodome
    - uses: actions/download-artifact@v4
      with:
        name: qwen-production-state-${{ inputs.task_slot }}
        path: ${{ runner.temp }}/qwen-shards/inbox
    - name: publish
      run: python -m scripts.production_qwen publish
    - uses: actions/upload-artifact@v4
      if: ${{ always() }}
      with:
        name: qwen-production-published-${{ inputs.task_slot }}
        path: ${{ runner.temp }}/qwen-shards/out/published.enc
        retention-days: 7
        compression-level: 0
        overwrite: true
        if-no-files-found: ignore
    - name: clean
      run: python -m scripts.production_qwen clean
      if: ${{ always() }}

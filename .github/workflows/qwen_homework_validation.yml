name: Qwen Homework Tail Validation
'on':
  push:
    branches: [codex/qwen-production-pilot]
    paths: [.github/workflows/qwen_homework_validation.yml]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Authorized completed high algebra classroom
        type: string
        default: ''
      source_slot:
        type: string
        default: '0'
      recipient_public_key:
        description: Ephemeral X25519 public key for private review results
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ github.event_name == 'push' && format('icourse-registration-{0}', github.run_id) || format('icourse-data-{0}', github.repository) }}
  cancel-in-progress: false
  queue: max
jobs:
  register:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
    - run: echo 'Tail validation registered; no classroom processing on push'
  review:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      SOURCE_SLOT: ${{ inputs.source_slot }}
      RECIPIENT_PUBLIC_KEY: ${{ inputs.recipient_public_key }}
      DB_ENCRYPTION_KEY: ${{ secrets.DB_ENCRYPTION_KEY }}
      HOMEWORK_VALIDATION_CONFIG: ${{ secrets.HOMEWORK_VALIDATION_CONFIG }}
      GH_TOKEN: ${{ github.token }}
      QWEN_PRODUCTION_TASK: 'true'
      AUTO_COURSE_TERMS: 'false'
      StuId: ${{ secrets.STUID }}
      UISPsw: ${{ secrets.UISPSW }}
      UIS_OTP_SECRET: ${{ secrets.UIS_OTP_SECRET }}
      DOUBAO_ASR_API_KEY: ${{ secrets.DOUBAO_ASR_API_KEY }}
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      DASHSCOPE_BASE_URL: ${{ secrets.DASHSCOPE_BASE_URL }}
      DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
      GEMINI_BASE_URL: ${{ secrets.GEMINI_BASE_URL }}
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: ./.github/actions/qwen-pilot-runtime
      with:
        inference: 'true'
    - name: Review only the authorized final ten minutes
      run: python -m scripts.production_homework_validation
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: qwen-homework-private-result
        path: ${{ runner.temp }}/qwen-shards/out/homework-result.enc
        retention-days: 7
        if-no-files-found: ignore
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: qwen-homework-tail-audit
        path: ${{ runner.temp }}/qwen-shards/out/homework-audit.json
        retention-days: 7
        if-no-files-found: ignore
    - name: Delete temporary private material
      if: always()
      run: python -m scripts.production_qwen clean

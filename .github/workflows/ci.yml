name: CI
'on':
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: requirements-runtime.txt
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: npm
    - run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg fonts-noto-cjk libpango-1.0-0 libcairo2
    - name: Install test dependencies without model inference runtimes
      env:
        TEST_REQUIREMENTS: ${{ runner.temp }}/test-requirements.txt
      run: |
        python - <<'PYTHON'
        import os
        import re
        from pathlib import Path
        # Tests mock VAD and skip the optional recognition requirements.
        lines = [line for line in Path('requirements-runtime.txt').read_text().splitlines()
                 if re.split(r'[<>=!~ ]', line.strip(), 1)[0] != 'sherpa-onnx']
        Path(os.environ['TEST_REQUIREMENTS']).write_text('\n'.join(lines) + '\nPyYAML\n')
        PYTHON
        python -m pip install -r "$TEST_REQUIREMENTS"
    - run: npm ci --ignore-scripts
    - name: Full repository tests including frontend security
      run: python -m unittest discover -s tests

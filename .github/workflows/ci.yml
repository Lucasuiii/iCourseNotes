name: CI
'on':
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: requirements-runtime.txt
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: npm
    - run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg fonts-noto-cjk libpango-1.0-0 libcairo2
    - name: Install the shared runtime and test dependencies
      run: python -m pip install -r requirements-runtime.txt PyYAML
    - run: npm ci --ignore-scripts
    - name: Full repository tests including frontend security
      run: python -m unittest discover -s tests

name: Qwen Homework Board Replay
'on':
  push:
    branches: [codex/homework-board-evidence]
    paths: [.github/workflows/qwen_homework_visual_validation.yml]
  workflow_dispatch:
    inputs:
      recipient_public_key:
        description: Ephemeral X25519 public key for encrypted board results
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ github.event_name == 'push' && format('icourse-registration-{0}', github.run_id) || format('icourse-data-{0}', github.repository) }}
  cancel-in-progress: false
  queue: max
jobs:
  register:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
    - run: echo 'Visual-only replay registered; no classroom work on push'
  replay:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RECIPIENT_PUBLIC_KEY: ${{ inputs.recipient_public_key }}
      DB_ENCRYPTION_KEY: ${{ secrets.DB_ENCRYPTION_KEY }}
      HOMEWORK_VALIDATION_CONFIG: ${{ secrets.HOMEWORK_VALIDATION_CONFIG }}
      GH_TOKEN: ${{ github.token }}
      QWEN_PRODUCTION_TASK: 'true'
      AUTO_COURSE_TERMS: 'false'
      StuId: ${{ secrets.STUID }}
      UISPsw: ${{ secrets.UISPSW }}
      UIS_OTP_SECRET: ${{ secrets.UIS_OTP_SECRET }}
      OMP_NUM_THREADS: '4'
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: ./.github/actions/qwen-pilot-runtime
    - name: Replay original board window without any audio or cloud call
      run: python -m scripts.production_homework_visual_validation
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: qwen-homework-visual-private-result
        path: ${{ runner.temp }}/qwen-shards/out/homework-visual-result.enc
        retention-days: 7
        if-no-files-found: ignore
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: qwen-homework-visual-audit
        path: ${{ runner.temp }}/qwen-shards/out/homework-visual-audit.json
        retention-days: 7
        if-no-files-found: ignore
    - name: Clean private working files
      if: always()
      run: python -m scripts.production_qwen clean

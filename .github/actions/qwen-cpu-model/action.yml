name: Qwen CPU model runtime
description: Install the pinned CPU-only Qwen inference runtime
inputs:
  extras:
    description: Install the additional Python dependencies for recognition
    default: 'false'
runs:
  using: composite
  steps:
  - shell: bash
    env:
      INSTALL_RECOGNITION_EXTRAS: ${{ inputs.extras }}
    run: |
      python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
      python -m pip install qwen-asr==0.0.6 --no-deps
      if [ "$INSTALL_RECOGNITION_EXTRAS" = 'true' ]; then
        python -m pip install -r requirements-qwen.txt
      fi

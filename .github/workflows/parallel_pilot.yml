name: iCourse Parallel Pilot
'on':
  push:
    branches:
    - codex/qwen-production-pilot
    paths:
    - .github/workflows/parallel_pilot.yml
  workflow_dispatch:
    inputs:
      validation_course_id:
        description: Validate latest playable lecture per course, comma-separated IDs (max 5; no publication/email)
        type: string
        default: ''
      validation_lecture_rank:
        description: Reverse rank among actual playable recordings (1 latest, 2 penultimate)
        type: number
        default: 1
      validation_lecture_ranks:
        description: Optional ranks for one isolated course, e.g. 1,2 (max 5; keep single rank at 1)
        type: string
        default: ''
      validation_before_date:
        description: Select only recordings strictly before this date (YYYY-MM-DD)
        type: string
        default: ''
      validation_on_date:
        description: Require recordings on this exact date (YYYY-MM-DD); never substitute older lectures
        type: string
        default: ''
      validation_source_run_id:
        description: Explicitly reacquire the exact failed preparation selection and frozen glossary from this completed run
        type: string
        default: ''
      validation_selection_run_id:
        description: Explicit fresh pre-ASR trial with the exact frozen selections of an ended pool run
        type: string
        default: ''
      automatic_terms:
        description: Enable evidence-bounded automatic glossary
        type: boolean
        default: false
      shard_mode:
        description: Fixed two/auto shards, or shared global Runner pool (up to six workers per lecture)
        type: choice
        options:
        - '2'
        - auto
        - shared
        default: shared
      publish_results:
        description: Publish encrypted lecture results to the data branch
        type: boolean
        default: false
      send_email:
        description: Send course emails after publication (requires publish_results)
        type: boolean
        default: false
  workflow_call:
    inputs:
      historical_preview:
        description: Read and mask exact targets from the dedicated historical caller event
        type: boolean
        default: false
      validation_course_id:
        type: string
        default: ''
      validation_lecture_rank:
        type: number
        default: 1
      validation_lecture_ranks:
        type: string
        default: ''
      validation_before_date:
        type: string
        default: ''
      validation_on_date:
        type: string
        default: ''
      validation_source_run_id:
        type: string
        default: ''
      validation_selection_run_id:
        type: string
        default: ''
      automatic_terms:
        type: boolean
        default: false
      shard_mode:
        type: string
        default: shared
      publish_results:
        type: boolean
        default: false
      send_email:
        type: boolean
        default: false
      caller_holds_lock:
        type: boolean
        default: false
    secrets:
      DB_ENCRYPTION_KEY:
        required: true
      STUID:
        required: true
      UISPSW:
        required: true
      COURSE_IDS:
        required: true
      DOUBAO_ASR_API_KEY:
        required: false
      TAVILY_API_KEY:
        required: false
      DASHSCOPE_API_KEY:
        required: false
      SMTP_PASSWORD:
        required: false
      DEEPSEEK_API_KEY:
        required: false
      GEMINI_API_KEY:
        required: false
      DASHSCOPE_BASE_URL:
        required: false
      DEEPSEEK_BASE_URL:
        required: false
      GEMINI_BASE_URL:
        required: false
      COURSE_SESSION_RULES:
        required: false
      COURSE_SESSION_EXCLUSIONS:
        required: false
      COURSE_SESSION_OVERRIDE_DATES:
        required: false
      SMTP_EMAIL:
        required: false
      RECEIVER_EMAILS:
        required: false
      RECEIVER_EMAIL:
        required: false
permissions:
  actions: read
  contents: write
concurrency:
  group: ${{ github.event_name == 'push' && format('icourse-registration-{0}', github.run_id)
    || inputs.caller_holds_lock && format('icourse-subrun-{0}', github.run_id)
    || format('icourse-data-{0}', github.repository) }}
  cancel-in-progress: false
  queue: max
jobs:
  register:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    steps:
    - run: echo 'Manual pilot entry registered; no classroom processing on push'
  plan:
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    env:
      DB_ENCRYPTION_KEY: ${{ secrets.DB_ENCRYPTION_KEY }}
      GH_TOKEN: ${{ github.token }}
      QWEN_PRODUCTION_TASK: 'true'
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      StuId: ${{ secrets.STUID }}
      UISPsw: ${{ secrets.UISPSW }}
      COURSE_IDS: ${{ secrets.COURSE_IDS }}
      COURSE_SESSION_RULES: ${{ secrets.COURSE_SESSION_RULES }}
      COURSE_SESSION_EXCLUSIONS: ${{ secrets.COURSE_SESSION_EXCLUSIONS }}
      COURSE_SESSION_OVERRIDE_DATES: ${{ secrets.COURSE_SESSION_OVERRIDE_DATES }}
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      VALIDATION_COURSE_ID: ${{ inputs.validation_course_id }}
      VALIDATION_LECTURE_RANK: ${{ inputs.validation_lecture_rank }}
      VALIDATION_LECTURE_RANKS: ${{ inputs.validation_lecture_ranks }}
      VALIDATION_BEFORE_DATE: ${{ inputs.validation_before_date }}
      VALIDATION_ON_DATE: ${{ inputs.validation_on_date }}
      VALIDATION_SOURCE_RUN_ID: ${{ inputs.validation_source_run_id }}
      VALIDATION_SELECTION_RUN_ID: ${{ inputs.validation_selection_run_id }}
      AUTO_COURSE_TERMS: ${{ inputs.automatic_terms }}
      PUBLISH_RESULTS: ${{ inputs.publish_results }}
      SEND_EMAIL: ${{ inputs.send_email }}
      SHARD_MODE: ${{ inputs.shard_mode }}
    outputs:
      tasks: ${{ steps.plan.outputs.tasks }}
      count: ${{ steps.plan.outputs.count }}
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Mask exact historical selection before runtime setup
      if: ${{ inputs.historical_preview }}
      run: python -m scripts.history_refresh mask-selection
    - uses: ./.github/actions/qwen-pilot-runtime
    - name: plan
      run: python -m scripts.production_qwen plan
      id: plan
    - uses: actions/upload-artifact@v4
      if: ${{ always() }}
      with:
        name: qwen-production-queue
        path: ${{ runner.temp }}/qwen-shards/out/queue.enc
        retention-days: 7
        compression-level: 0
        overwrite: true
        if-no-files-found: ignore
    - uses: actions/upload-artifact@v4
      if: ${{ always() }}
      with:
        name: qwen-production-plan-audit
        path: |
          ${{ runner.temp }}/qwen-shards/out/plan-audit.json
          ${{ runner.temp }}/qwen-shards/out/pipeline-failure.json
        retention-days: 7
        overwrite: true
        if-no-files-found: ignore
    - uses: actions/upload-artifact@v4
      if: ${{ always() && inputs.validation_course_id != '' }}
      with:
        name: qwen-validation-selection
        path: ${{ runner.temp }}/qwen-shards/out/validation-selection.json
        retention-days: 7
        overwrite: true
        if-no-files-found: ignore
    - uses: actions/upload-artifact@v4
      if: ${{ always() }}
      with:
        name: qwen-production-pool-audit
        path: ${{ runner.temp }}/qwen-shards/out/pool-audit.json
        retention-days: 7
        overwrite: true
        if-no-files-found: ignore
    - name: clean
      run: python -m scripts.production_qwen clean
      if: ${{ always() }}
  lecture:
    needs: plan
    if: ${{ needs.plan.result == 'success' && needs.plan.outputs.count != '0' && inputs.shard_mode != 'shared' }}
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJSON(needs.plan.outputs.tasks) }}
    uses: ./.github/workflows/qwen_production_lecture.yml
    with:
      task_slot: ${{ matrix.task_slot }}
      automatic_terms: ${{ inputs.automatic_terms }}
      shard_mode: ${{ inputs.shard_mode }}
      publish_results: ${{ inputs.publish_results }}
    secrets:
      DB_ENCRYPTION_KEY: ${{ secrets.DB_ENCRYPTION_KEY }}
      STUID: ${{ secrets.STUID }}
      UISPSW: ${{ secrets.UISPSW }}
      COURSE_IDS: ${{ secrets.COURSE_IDS }}
      DOUBAO_ASR_API_KEY: ${{ secrets.DOUBAO_ASR_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      DASHSCOPE_BASE_URL: ${{ secrets.DASHSCOPE_BASE_URL }}
      DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
      GEMINI_BASE_URL: ${{ secrets.GEMINI_BASE_URL }}
  finalize:
    needs:
    - plan
    - lecture
    - pool
    if: ${{ always() && !cancelled() && needs.plan.result == 'success'
      && (inputs.shard_mode != 'shared' || needs.plan.outputs.count == '0' || needs.pool.outputs.all_ended == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DB_ENCRYPTION_KEY: ${{ secrets.DB_ENCRYPTION_KEY }}
      GH_TOKEN: ${{ github.token }}
      QWEN_PRODUCTION_TASK: 'true'
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      StuId: ${{ secrets.STUID }}
      UISPsw: ${{ secrets.UISPSW }}
      COURSE_IDS: ${{ secrets.COURSE_IDS }}
      COURSE_SESSION_RULES: ${{ secrets.COURSE_SESSION_RULES }}
      COURSE_SESSION_EXCLUSIONS: ${{ secrets.COURSE_SESSION_EXCLUSIONS }}
      COURSE_SESSION_OVERRIDE_DATES: ${{ secrets.COURSE_SESSION_OVERRIDE_DATES }}
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      PUBLISH_RESULTS: ${{ inputs.publish_results }}
      SEND_EMAIL: ${{ inputs.send_email }}
      SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
      RECEIVER_EMAILS: ${{ secrets.RECEIVER_EMAILS }}
      RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
      POOL_ARTIFACTS: ${{ inputs.shard_mode == 'shared' && needs.plan.outputs.count != '0' && 'true' || 'false' }}
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: ./.github/actions/qwen-pilot-runtime
    - uses: actions/download-artifact@v4
      with:
        name: qwen-production-queue
        path: ${{ runner.temp }}/qwen-shards/inbox
    - name: finalize
      run: python -m scripts.production_qwen finalize
    - uses: actions/upload-artifact@v4
      if: ${{ always() }}
      with:
        name: qwen-production-mail-receipts
        path: ${{ runner.temp }}/qwen-shards/out/receipts.enc
        retention-days: 7
        compression-level: 0
        overwrite: true
        if-no-files-found: ignore
    - uses: actions/upload-artifact@v4
      if: ${{ always() }}
      with:
        name: qwen-production-catalog
        path: ${{ runner.temp }}/qwen-shards/out/catalog.enc
        retention-days: 7
        compression-level: 0
        overwrite: true
        if-no-files-found: ignore
    - uses: actions/upload-artifact@v4
      if: ${{ always() }}
      with:
        name: qwen-production-pool-failures
        path: ${{ runner.temp }}/qwen-shards/out/pool-failures.enc
        retention-days: 7
        compression-level: 0
        overwrite: true
        if-no-files-found: ignore
    - name: clean
      run: python -m scripts.production_qwen clean
      if: ${{ always() }}
  pool:
    name: 课堂并发进度（获取 → 识别 → 汇总）
    concurrency:
      group: icourse-runner-controller-${{ github.repository }}
      cancel-in-progress: false
    needs: plan
    if: ${{ needs.plan.result == 'success' && needs.plan.outputs.count != '0' && inputs.shard_mode == 'shared' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
      actions: write
    outputs:
      all_ended: ${{ steps.controller.outputs.all_ended }}
    env:
      GH_TOKEN: ${{ github.token }}
      DB_ENCRYPTION_KEY: ${{ secrets.DB_ENCRYPTION_KEY }}
      QWEN_PRODUCTION_TASK: 'true'
      POOL_ARTIFACTS: 'true'
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: python -m pip install cryptography pycryptodome requests
    - name: 实时课堂进度（展开查看块数与 Worker 链接）
      id: controller
      run: python -m scripts.production_pool
    - uses: actions/upload-artifact@v4
      if: ${{ always() }}
      with:
        name: qwen-production-pool-audit
        path: |
          ${{ runner.temp }}/qwen-shards/out/pool-audit.json
          ${{ runner.temp }}/qwen-shards/out/pool-progress.json
        retention-days: 7
        overwrite: true
        if-no-files-found: ignore
    - name: clean
      if: ${{ always() }}
      run: python -m scripts.production_qwen clean

name: iCourse Check
permissions:
  actions: read
  contents: write
jobs:
  check:
    uses: ./.github/workflows/parallel_pilot.yml
    with:
      automatic_terms: false
      shard_mode: shared
      publish_results: true
      send_email: true
      caller_holds_lock: true
    secrets: inherit
    permissions:
      contents: write
      actions: write
'on':
  schedule:
  # 18:00 Asia/Taipei (UTC+8); exactly one daily schedule.
  - cron: '0 10 * * *'
  workflow_dispatch: null
concurrency:
  group: icourse-data-${{ github.repository }}
  cancel-in-progress: false
  queue: max
